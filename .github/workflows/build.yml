name: Build mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q colorgrade-neoforge-1.21.1.zip -d out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build --no-daemon
        working-directory: out/colorgrade-neoforge-1.21.1
      - uses: actions/upload-artifact@v4
        with:
          name: colorgrade-jar
          path: out/colorgrade-neoforge-1.21.1/build/libs/*.jar
